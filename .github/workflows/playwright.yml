name: Playwright Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag to execute'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          if [ -n "${{ inputs.grep }}" ]; then
            npx playwright test --grep "${{ inputs.grep }}"
          else
            npx playwright test
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/