name: Playwright Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      grep:
        description: 'Select test suite/tag'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '@smoke'
          - '@critical'
          - '@negative'
          - '@regression'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run Playwright tests
        shell: pwsh
        env:
          GREP: ${{ inputs.grep }}
        run: |
          if ($env:GREP -and $env:GREP -ne 'all') {
            npx playwright test --grep "$env:GREP"
          }
          else {
            npx playwright test
          }

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
